<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple touch icon source (rendered at 512, resized to 180)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(110% 100% at 50% 0%, #2b6244 0%, #1f4d36 55%, #123023 100%);
  }
  .string { position: absolute; left: 50%; top: 0; width: 5px; height: 78px; background: #f0d99a; transform: translateX(-50%); }
  .cap {
    position: absolute; left: 50%; top: 78px; width: 90px; height: 50px; transform: translateX(-50%); z-index: 2;
    border-radius: 14px 14px 6px 6px; background: linear-gradient(90deg, #b88a2e, #f3d584 40%, #b88a2e);
  }
  .cap::before { content: ""; position: absolute; top: -26px; left: 50%; width: 34px; height: 34px; transform: translateX(-50%); border: 6px solid #e3bb5f; border-radius: 50%; }
  .bauble {
    position: absolute; left: 76px; top: 108px; width: 360px; height: 360px; border-radius: 50%;
    border: 16px solid #d6a84b;
    background: radial-gradient(circle at 32% 26%, #e9606a 0%, #8f2430 48%, #721c26 100%);
    box-shadow: 0 0 0 8px #721c26, inset 0 -40px 70px rgb(0 0 0 / 0.25);
  }
  .bauble::before { content: ""; position: absolute; top: 9%; left: 14%; width: 34%; height: 20%; border-radius: 50%; background: rgb(255 255 255 / 0.3); transform: rotate(-32deg); }
  .bauble::after { content: "\2605"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 150px; color: #f0d99a; padding-top: 30px; }
</style>
</head>
<body>
  <div class="string"></div>
  <div class="cap"></div>
  <div class="bauble"></div>
</body>
</html>
